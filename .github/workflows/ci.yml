name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "import pandas, sklearn, fastapi, uvicorn, joblib, mlflow, xgboost; print('Imports OK')"

      - name: Check syntax
        run: |
          python -m compileall api train.py

      - name: Build Docker image
        run: |
          docker build -t churn-api .